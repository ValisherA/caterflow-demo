<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>CaterFlow — catering, ijara va tadbir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* zumrad + oltin: “em-*” — to‘q yashil (sarlavha, urg‘u, tugmalar), sahifalar oq, oltin asosiy urg‘u */
  --em-950:#061F18;--em-900:#0A2C23;--em-800:#0F3A2E;--em-700:#1A4D3E;--em-600:#2A6552;--em-500:#3F7D68;--em-100:#D7E9DF;--em-50:#EAF4EF;
  --milk:#F5F8F6;--milk-2:#EDF3EF;--milk-3:#E1EBE5;
  --gold-800:#7D5C1C;--gold-700:#9A7428;--gold-600:#B08A35;--gold:#C9A24A;--gold-400:#D9B862;--gold-300:#E6CC85;--gold-200:#EFDDAA;--gold-100:#F7EDD2;--gold-50:#FCF7EA;
  --cream:#F7F9F7;--paper:#FFFFFF;--ink:#14231D;--ink-2:#2E4038;--muted:#4F6159;--faint:#5E6F67;--line:#E2EAE5;--line-2:#CBD9D1;
  --good:#1E7A4C;--good-bg:#E5F3EB;--bad:#B23E2E;--bad-bg:#FBEAE6;--warn:#A86A12;--warn-bg:#FBF0DC;--info:#2D6690;--info-bg:#E5EFF7;
  /* yuzalar: oq sarlavha, to‘q yashil bosh banner */
  --hd-bg:rgba(255,255,255,.94);--hd-line:#E2EAE5;--sh-rgb:10,44,35;
  --hero-bg:linear-gradient(160deg,#0F3A2E 0%,#0A2C23 100%);--hero-ink:#FFFFFF;--hero-ink-2:rgba(255,255,255,.86);--hero-muted:rgba(255,255,255,.74);--hero-em:var(--gold-300);--hero-eyebrow:var(--gold-300);--hero-line:rgba(201,162,74,.35);
  --sub-bg:linear-gradient(180deg,#EAF4EF,#F5F8F6);--hl-bg:linear-gradient(135deg,#E3EFE8,#F7FAF8);
  --r:14px;--r-sm:9px;--sh:0 1px 2px rgba(var(--sh-rgb),.05),0 10px 30px rgba(var(--sh-rgb),.07);--sh-lg:0 24px 64px rgba(var(--sh-rgb),.22);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
img,svg{display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,46px);letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:clamp(22px,2.8vw,30px)}
h3{font-size:17px}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--em-800);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}.num{font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.block{display:block}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.nowrap{flex-wrap:nowrap}.grow{flex:1;min-width:0}
.stack{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}.stack-s{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}.stack-xs{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.g{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}.gold-t{color:var(--gold-800)}
/* tugmalar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;text-decoration:none}
.btn:hover{border-color:var(--em-600)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-gold{background:var(--gold);border-color:#8A6A22;color:var(--em-950);box-shadow:0 1px 0 rgba(125,92,28,.25)}.btn-gold:hover{background:var(--gold-400);border-color:#8A6A22}
.btn-em{background:var(--em-800);border-color:var(--em-800);color:#fff}.btn-em:hover{background:var(--em-700);border-color:var(--em-700)}
.btn-ghost{background:transparent;border-color:transparent}.btn-ghost:hover{background:rgba(var(--sh-rgb),.06);border-color:transparent}
.btn-line{background:transparent;border-color:rgba(var(--sh-rgb),.22);color:var(--ink)}.btn-line:hover{border-color:var(--gold-600);color:var(--gold-800)}
.btn-sm{min-height:40px;padding:0 14px;font-size:13.5px}.btn-lg{min-height:52px;padding:0 26px;font-size:15.5px}.btn-block{width:100%}
.btn-danger{color:var(--bad);border-color:#E8C3BB}
.link{background:none;border:0;padding:0;color:var(--gold-800);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold-300);text-underline-offset:3px}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:999px;border:1px solid transparent;background:transparent}
.icon-btn:hover{background:rgba(var(--sh-rgb),.07)}
.ic{display:inline-block;vertical-align:middle;flex:none}
/* belgilar */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--em-50);color:var(--em-700);white-space:nowrap}
.pill.gold{background:var(--gold-100);color:var(--gold-800)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutral{background:#EFEDE7;color:#5B605D}.pill.dark{background:var(--em-800);color:var(--gold-200)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--em-950);font-size:11px;font-weight:700}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}.stars .off{color:#D9D2C1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--em-600)}.chip.on{background:var(--em-800);border-color:var(--em-800);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* kartochkalar */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section{padding:56px 0}.section-sm{padding:34px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-800)}
.lead{font-size:17px;color:var(--muted);max-width:640px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);background:rgba(255,255,255,.5)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--info-bg);color:#1E4A69;font-size:13.5px}
.note.gold{background:var(--gold-50);color:var(--gold-800);border:1px solid var(--gold-200)}.note.good{background:var(--good-bg);color:#145A37}.note.bad{background:var(--bad-bg);color:#8A2E21}.note.warn{background:var(--warn-bg);color:#7C4E0E}
.divider{height:1px;background:var(--line);margin:4px 0}
/* forma */
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper)}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.22)}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--gold-700)}
.err{color:var(--bad);font-size:13px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);overflow:hidden}
.qty button{width:44px;height:44px;border:0;background:transparent;font-size:18px;font-weight:600;color:var(--em-800)}.qty button:hover{background:var(--em-50)}
.qty input{width:70px;border:0;text-align:center;font-weight:700;height:44px;background:transparent;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:inline-flex;background:var(--em-50);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}.seg button.on{background:var(--paper);color:var(--em-800);box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* sarlavha */
.hd{position:sticky;top:0;z-index:40;background:var(--hd-bg);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);color:var(--ink);border-bottom:1px solid var(--hd-line)}
.hd-in{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.01em}
.brand .mk{color:var(--gold-600)}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-800);font-weight:600;margin-top:-2px}
.hd-nav{display:flex;gap:2px;margin-left:12px}
.hd-nav button{white-space:nowrap;border:0;background:transparent;color:var(--ink-2);padding:9px 11px;border-radius:999px;font-size:14px;font-weight:500}
.hd-nav button:hover{color:var(--ink);background:var(--milk-3)}.hd-nav button.on{color:var(--gold-800);background:var(--gold-100);font-weight:600}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.hd .icon-btn{color:var(--ink)}.hd .icon-btn:hover{background:var(--milk-3)}
.cart-btn{position:relative}.cart-btn .badge{position:absolute;top:-2px;right:-4px}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:6px 9px}.lang button.on{background:var(--gold);color:var(--em-950)}
.burger{display:none}
.mnav{display:none}
/* hero */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);overflow:hidden;border-bottom:1px solid var(--hero-line)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 500px at 85% -10%,rgba(201,162,74,.26),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(230,204,133,.3),transparent 60%);pointer-events:none}
.hero .orn{position:absolute;right:-60px;top:-40px;width:520px;height:520px;opacity:.26;color:var(--gold-600)}
.hero-in{position:relative;padding-top:64px;padding-bottom:56px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1 em{font-style:normal;color:var(--hero-em)}
.hero .eyebrow{color:var(--hero-eyebrow)}.hero .muted{color:var(--hero-muted)}.hero .link{color:var(--hero-em);text-decoration-color:currentColor}
.hero .btn-line{color:var(--hero-ink);border-color:var(--hero-line)}.hero .btn-line:hover{color:var(--hero-em);border-color:var(--hero-em)}
.hero .lead{color:var(--hero-ink-2);margin-top:14px}
.hero-stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.hero-stats b{display:block;font-family:var(--serif);font-size:26px;color:var(--hero-em);font-weight:600}.hero-stats span{font-size:13px;color:var(--hero-muted)}
.search{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 2px 6px rgba(var(--sh-rgb),.06),0 22px 50px rgba(var(--sh-rgb),.12);display:grid;gap:12px;border:1px solid rgba(201,162,74,.4)}
.search h3{font-family:var(--serif);font-size:21px}
.search .f-grid{grid-template-columns:1fr 1fr}
/* tadbir qatori: bitta gorizontal qator (ezCater kabi) */
.hero-in.wide{grid-template-columns:minmax(0,1fr);gap:0;padding-top:58px;padding-bottom:46px}
.hero-copy{max-width:780px}
.hbar{display:grid;grid-template-columns:1.2fr 1.1fr 1fr 1.1fr 1fr auto;align-items:stretch;background:var(--paper);color:var(--ink);border:1px solid rgba(201,162,74,.45);border-radius:18px;padding:7px;box-shadow:0 2px 6px rgba(var(--sh-rgb),.06),0 22px 50px rgba(var(--sh-rgb),.16)}
.hero .hbar{margin-top:30px}
.hb-f{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:7px 16px;border-radius:12px;min-width:0;position:relative}
.hb-f+.hb-f::before{content:"";position:absolute;left:0;top:14px;bottom:14px;border-left:1px solid var(--line)}
.hb-f:hover{background:var(--milk-2)}.hb-f:focus-within{background:var(--gold-50);box-shadow:inset 0 0 0 2px var(--gold)}.hb-f:focus-within::before,.hb-f:hover::before,.hb-f:focus-within+.hb-f::before,.hb-f:hover+.hb-f::before{opacity:0}
.hb-f label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.hb-f input,.hb-f select{border:0;background:transparent;padding:0;font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);min-height:30px;width:100%;outline:none;cursor:pointer}
.hb-f input::placeholder{color:var(--faint);font-weight:500}
.hbar>.btn{margin-left:6px;border-radius:13px;min-height:58px;padding:0 26px;font-size:15.5px}
.hb-note{margin-top:12px;font-size:13px}
.hbar.sm{border-radius:14px;padding:4px;box-shadow:none;border-color:var(--line-2)}
.hbar.sm .hb-f{padding:4px 12px}.hbar.sm .hb-f input,.hbar.sm .hb-f select{font-size:14px;min-height:26px}.hbar.sm .hb-f label{font-size:10.5px}
.hbar.sm>.btn{min-height:46px;border-radius:11px;padding:0 18px;font-size:14px}
.evbar .hbar.sm{flex:1}
.hbar.sm .hb-f.need{background:var(--gold-50)}.hbar.sm .hb-f.need label::after{content:" *";color:var(--gold-800)}
.evbar-b.mob{display:none}
@media (max-width:1020px){.hbar{grid-template-columns:1fr 1fr;gap:6px;padding:10px}.hb-f{border:1px solid var(--line);padding:8px 14px}.hb-f+.hb-f::before{display:none}.hbar>.btn{grid-column:1/-1;margin:2px 0 0}.evbar .hbar.sm{display:none}.evbar-b.mob{display:inline-flex}}
@media (max-width:560px){.hb-f:first-child{grid-column:1/-1}.hero-in.wide{padding-top:36px;padding-bottom:32px}}
.sub-hero{background:var(--sub-bg);color:var(--ink);position:relative;overflow:hidden;border-bottom:1px solid var(--hd-line)}
.sub-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 360px at 90% -20%,rgba(201,162,74,.28),transparent 60%);pointer-events:none}
.sub-hero .wrap{position:relative;padding-top:38px;padding-bottom:34px}
.sub-hero .lead{color:var(--ink-2);margin-top:8px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}.crumbs button{background:none;border:0;color:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}
/* illyustratsiya plitkalari */
.art{position:relative;display:grid;place-items:center;border-radius:12px;overflow:hidden;color:var(--gold-800);aspect-ratio:4/3;background:var(--milk-3)}
.art svg.ill{width:46%;height:auto;max-width:120px;filter:drop-shadow(0 4px 10px rgba(125,92,28,.18))}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.45),transparent 55%);pointer-events:none}
.art.t0{background:linear-gradient(150deg,#F4E8D2,#E7D3AF)}.art.t1{background:linear-gradient(150deg,#F2E2C4,#DEC08D)}.art.t2{background:linear-gradient(150deg,#EFE7D6,#DACDB3)}.art.t3{background:linear-gradient(150deg,#F3E2D9,#DFC3B3)}.art.t4{background:linear-gradient(150deg,#F5E3B6,#DFBE74)}.art.t5{background:linear-gradient(150deg,#ECE1D5,#CDB9A5)}
.art .cap{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);font-size:12px;font-weight:600;color:var(--ink);background:rgba(255,253,248,.88);padding:2px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .vid{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(var(--sh-rgb),.6);display:grid;place-items:center;color:#fff}
.art.sq{aspect-ratio:1/1}.art.wide{aspect-ratio:16/9}
.art.sq .cap,.art.sq .vid{display:none}.art.sq svg.ill{width:62%}
.feed .art.sq,.card-h .art.sq,.ai-card .art{width:56px;flex:none;border-radius:10px}.card-h .art.sq{width:64px}
.strip{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;border-radius:12px;overflow:hidden}
.strip .art{border-radius:0;aspect-ratio:auto;min-height:72px}.strip .art:first-child{grid-row:span 2;min-height:150px}
/* vendor kartochkasi */
.vcard{display:flex;flex-direction:column;gap:12px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.vcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(var(--sh-rgb),.06),0 18px 40px rgba(var(--sh-rgb),.12)}
.vcard.dim{opacity:.6}
.vcard h3{font-size:17px}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.price{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--em-800)}
.price small{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:500}
/* set kartochkasi */
.scard{display:flex;flex-direction:column;overflow:hidden;padding:0}
.scard .art{border-radius:0}
.scard .b{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard .f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.tag-choice{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--gold-800);background:var(--gold-50);border:1px solid var(--gold-200);border-radius:999px;padding:3px 10px}
/* menyu ro‘yxati */
.mlist{display:grid;gap:12px}
.msec h4{margin-bottom:6px}
.msec ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.msec li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.msec li .q{color:var(--faint);font-size:13px;white-space:nowrap}
.msec li.pick{color:var(--gold-800);font-weight:600}
/* tanlov plitkalari */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;padding:0;border:2px solid var(--line);border-radius:13px;background:var(--paper);text-align:left;overflow:hidden;transition:border-color .12s,transform .1s}
.opt:hover{border-color:var(--gold-300)}
.opt .art{border-radius:0;aspect-ratio:16/10}
.opt .t{padding:0 10px 10px;display:grid;gap:2px}
.opt .t strong{font-size:13.5px}.opt .t span{font-size:12px;color:var(--muted)}
.opt .ck{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
